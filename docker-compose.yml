version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: saas_crm_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: saas_crm
    ports:
      - "3306:3306"
    volumes:
      - ./server/database/init-all.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
